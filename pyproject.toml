[project]
name = "cs4630"
version = "0.1.0"
description = "Supporting benchmarks and plots for a presentation on GPU computing"
readme = "README.md"
authors = [
    { name = "Sam", email = "sam@samly.me" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
]

[project.scripts]
cs4630 = "cs4630:main"
plot-matmul = "cs4630.plots:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
